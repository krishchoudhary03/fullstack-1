<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>@font-face Demo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@700&display=swap" rel="stylesheet">
<style>
    /* This is the syntax for loading a LOCAL font file with @font-face.
       (Commented out since no .ttf/.woff file is bundled with this page —
       the Poppins import above is used instead so the demo actually renders.)

    @font-face {
        font-family: "MyCustomFont";
        src: url("fonts/MyCustomFont.woff2") format("woff2"),
             url("fonts/MyCustomFont.ttf") format("truetype");
        font-weight: normal;
        font-style: normal;
    }
    */

    body {
        font-family: Arial, sans-serif;
        background: #1e1e2f;
        color: white;
        text-align: center;
        padding: 60px 20px;
    }

    h1 {
        font-family: "Poppins", sans-serif;
        font-size: 48px;
        margin-bottom: 10px;
    }

    p {
        color: #b2bec3;
        max-width: 500px;
        margin: 0 auto;
        line-height: 1.6;
    }

    code {
        background: #2d2d44;
        padding: 2px 6px;
        border-radius: 4px;
    }
</style>
</head>
<body>

    <h1>Custom Font Loaded</h1>
    <p>
        This heading uses a font pulled in with <code>@font-face</code> /
        a font import instead of the browser default. The same rule works
        for a font file sitting in your own project folder — just point
        <code>src: url(...)</code> at it.
    </p>

</body>
</html>
