


<!DOCTYPE html>
<html>
<head>
    <title>Arrays</title>
</head>
<body>
    <h2>arrays</h2>

    <script>
        let arr=[1,2,3,4,5];
console.log(arr);

//map
let newArr=arr.map(n=>n*n);
console.log(newArr);

//filter
let filteredArr=arr.filter(n=>n%2==0);
console.log(filteredArr);

//find
let foundArr=arr.find(n=>n>3);
console.log(foundArr);
        
    </script>
</body>
</html>
