<!DOCTYPE html>
<html>
<head>
    <title>Traffic Light</title>
</head>
<body>
    <h2>Traffic Light</h2>

    <script>
        var color = "red";

        switch (color) {
            case "red":
                console.log("stop");
                break;
            case "yellow":
                console.log("slow down");
                break;
            case "green":
                console.log("go");
                break;
            default:
                console.log("invalid color");
        }
    </script>
</body>
</html>
