<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Guess the Number</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background-color: lightgreen;
        }

        .game-container {
            width: 350px;
            margin: 100px auto;
            padding: 20px;
            background-color: white;
            border: 1px solid black;
        }

        input {
            padding: 8px;
            width: 150px;
        }

        button {
            padding: 8px 12px;
            margin: 5px;
            cursor: pointer;
        }

        #message {
            font-weight: bold;
        }
    </style>
</head>

<body>
    <div class="game-container">
        <h1>Guess the Number</h1>

        <p>1 se 20 ke beech koi number guess karein.</p>

        <input
            type="number"
            id="guessInput"
            min="1"
            max="20"
            placeholder="Apna number enter karein"
        >

        <button id="guessButton">Guess</button>
        <button id="resetButton">New Game</button>

        <p id="message">Game shuru karein!</p>
        <p id="attempts">Attempts: 0</p>
    </div>

    <script>
        let secretNumber = Math.floor(Math.random() * 20) + 1;
        let attemptCount = 0;

        function startGame() {
            secretNumber = Math.floor(Math.random() * 20) + 1;
            attemptCount = 0;

            document.getElementById("guessInput").value = "";
            document.getElementById("message").textContent = "Game shuru karein!";
            document.getElementById("attempts").textContent = "Attempts: 0";
        }

        function checkGuess() {
            const guessInput = document.getElementById("guessInput");
            const message = document.getElementById("message");
            const attempts = document.getElementById("attempts");
            const userGuess = Number(guessInput.value);

            if (guessInput.value === "" || userGuess < 1 || userGuess > 20) {
                message.textContent = "1 se 20 ke beech number enter karein.";
                return;
            }

            attemptCount++;
            attempts.textContent = `Attempts: ${attemptCount}`;

            if (userGuess === secretNumber) {
                message.textContent = "Congratulations! Aapka answer sahi hai.";
            } else if (userGuess < secretNumber) {
                message.textContent = "Number chhota hai.";
            } else {
                message.textContent = "Number bada hai.";
            }
        }

        document.getElementById("guessButton").addEventListener("click", checkGuess);
        document.getElementById("resetButton").addEventListener("click", startGame);
    </script>
</body>
</html>
