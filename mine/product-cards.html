<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Product Card Grid</title>
<style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: Arial, sans-serif; }

    body { background: #f4f6f8; padding: 40px; }

    h1 { text-align: center; color: #2d3436; margin-bottom: 30px; }

    .grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
        gap: 24px;
        max-width: 1000px;
        margin: 0 auto;
    }

    .card {
        background: white;
        border-radius: 14px;
        overflow: hidden;
        box-shadow: 0 6px 18px rgba(0,0,0,0.08);
        transition: transform 0.2s ease;
    }

    .card:hover { transform: translateY(-6px); }

    .card img {
        width: 100%;
        height: 160px;
        object-fit: cover;
        display: block;
    }

    .card-body { padding: 16px; }

    .card-body h3 { font-size: 16px; color: #2d3436; margin-bottom: 6px; }

    .price {
        color: #00b894;
        font-weight: bold;
        font-size: 18px;
        margin-bottom: 12px;
    }

    .price .old {
        color: #b2bec3;
        text-decoration: line-through;
        font-weight: normal;
        font-size: 14px;
        margin-left: 8px;
    }

    .add-btn {
        width: 100%;
        padding: 10px;
        background: #0984e3;
        color: white;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        font-size: 14px;
    }

    .add-btn:hover { background: #0767b1; }
</style>
</head>
<body>

    <h1>Featured Products</h1>

    <div class="grid">
        <div class="card">
            <img src="https://picsum.photos/300/200?random=11" alt="product">
            <div class="card-body">
                <h3>Wireless Headphones</h3>
                <div class="price">₹1,499 <span class="old">₹2,199</span></div>
                <button class="add-btn">Add to Cart</button>
            </div>
        </div>

        <div class="card">
            <img src="https://picsum.photos/300/200?random=12" alt="product">
            <div class="card-body">
                <h3>Smart Watch</h3>
                <div class="price">₹2,999</div>
                <button class="add-btn">Add to Cart</button>
            </div>
        </div>

        <div class="card">
            <img src="https://picsum.photos/300/200?random=13" alt="product">
            <div class="card-body">
                <h3>Bluetooth Speaker</h3>
                <div class="price">₹999 <span class="old">₹1,299</span></div>
                <button class="add-btn">Add to Cart</button>
            </div>
        </div>

        <div class="card">
            <img src="https://picsum.photos/300/200?random=14" alt="product">
            <div class="card-body">
                <h3>Mechanical Keyboard</h3>
                <div class="price">₹3,499</div>
                <button class="add-btn">Add to Cart</button>
            </div>
        </div>
    </div>

</body>
</html>
