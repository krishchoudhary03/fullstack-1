<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CSS-only Scroll Snap Slider</title>
<style>
    * { box-sizing: border-box; margin: 0; }

    body {
        font-family: Arial, sans-serif;
        background: #dfe6e9;
        padding: 40px 0;
    }

    h1 { text-align: center; color: #2d3436; margin-bottom: 20px; }

    .slider {
        display: flex;
        overflow-x: auto;
        scroll-snap-type: x mandatory;
        gap: 0;
        max-width: 500px;
        margin: 0 auto;
        border-radius: 16px;
        scrollbar-width: none; /* firefox */
    }

    .slider::-webkit-scrollbar { display: none; }

    .slide {
        flex: 0 0 100%;
        scroll-snap-align: center;
        height: 280px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 32px;
        color: white;
        font-weight: bold;
    }

    .slide:nth-child(1) { background: #e17055; }
    .slide:nth-child(2) { background: #00b894; }
    .slide:nth-child(3) { background: #0984e3; }
    .slide:nth-child(4) { background: #6c5ce7; }

    p.hint {
        text-align: center;
        color: #636e72;
        margin-top: 12px;
        font-size: 14px;
    }
</style>
</head>
<body>

    <h1>Scroll Snap Slider</h1>

    <div class="slider">
        <div class="slide">Slide 1</div>
        <div class="slide">Slide 2</div>
        <div class="slide">Slide 3</div>
        <div class="slide">Slide 4</div>
    </div>

    <p class="hint">Swipe / scroll horizontally — no JavaScript needed.</p>

</body>
</html>
