<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #f2f2f2;
      font-family: Arial, sans-serif;
    }

    .login-box {
      width: 600px;
      background: #f0f0f0;
      padding: 30px 20px;
      border: 1px solid #d9d9d9;
    }

    h1 {
      margin: 0 0 25px;
      font-size: 62px;
      font-weight: 700;
      text-align: left;
    }

    form {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 15px;
    }

    .row {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
    }

    label {
      width: 120px;
      text-align: right;
      margin-right: 12px;
      font-size: 20px;
    }

    input {
      width: 240px;
      height: 138px;
      padding: 5px 10px;
      font-size: 18px;
      border: 1px solid #999;
      background: #fff;
    }

    button {
      width: 120px;
      height: 40px;
      margin-left: 132px;
      font-size: 18px;
      background: #f3f3f3;
      border: 1px solid #999;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="login-box">
    <h1>Login</h1>

    <form>
      <div class="row">
        <label for="username">username</label>
        <input type="text" id="username" placeholder="Username" />
      </div>

      <div class="row">
        <label for="password">Password</label>
        <input type="password" id="password" placeholder="Password" />
      </div>

      <div class="row">
        <button type="submit">Login</button>
      </div>
    </form>
  </div>
</body>
</html>
