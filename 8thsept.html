<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Document</title>
    </head>
    <style>
    .container{
        display:grid;
        grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
        grid-template-rows: repeat(auto-fill, 1fr);
        grid-template-areas:
        "box1 box1 box2"
        "box1 box1 box2"
        "box3 box4 box7"
        "box3 box4 box7"
        "box3 box6 box7"
        "box5 box6 box7"
        "box5 box6 box7";

        
        outline:1px solid black;
    }
    .container>div{
        font-size: 20px;
        outline:1px dashed black;
    
    }
    .box1{
        grid-area: box1;
        background-color: lightblue;
    }
    .box2{
        grid-area: box2;
        background-color: lightgreen;
    }
    .box3{
        grid-area: box3;
        background-color: lightpink;
    }
    .box4{
        grid-area: box4;
        background-color: lightyellow;
    }
    .box5{
        grid-area: box5;
        background-color: lightgray;
    }
    .box6{
        grid-area: box6;   
        background-color: lightcoral;
    }
    .box7{
        grid-area: box7;
        background-color: lightgoldenrodyellow;
    }
    </style>
     
    <body>
        <div class="container">
            <div class="box1" style="grid-area: box1">Item 1</div>
            <div class="box2" style="grid-area: box2">Item 2</div>
            <div class="box3" style="grid-area: box3">Item 3</div>
            <div class="box4" style="grid-area: box4">Item 4</div>
            <div class="box5" style="grid-area: box5">Item 5</div>
            <div class="box6" style="grid-area: box6">Item 6</div>
            <div class="box7" style="grid-area: box7">Item 7</div>
        </div>
    </body>
</html>
